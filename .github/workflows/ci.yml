name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: salt-life
      # The Portal SDK isn't on npm: it's linked from All the Spaces, as All the Spaces itself does
      # when it builds the creation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shooter-git/all-the-spaces
          path: all-the-spaces
          sparse-checkout: |
            packages/portal-sdk
            packages/bridge-protocol
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: salt-life/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: salt-life
      - run: pnpm test
        working-directory: salt-life
      - run: pnpm build
        working-directory: salt-life
